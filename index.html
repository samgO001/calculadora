<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Lab 9</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="number"] {
            width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a6fd8;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🧮 Calculadora</h1>
        
        <div class="input-group">
            <input type="number" id="num1" placeholder="Primer número">
            <input type="number" id="num2" placeholder="Segundo número">
        </div>
        
        <div class="operations">
            <button onclick="sumar()">➕ Sumar</button>
            <button onclick="restar()">➖ Restar</button>
            <button onclick="multiplicar()">✖️ Multiplicar</button>
            <button onclick="dividir()">➗ Dividir</button>
        </div>
        
        <div class="advanced-operations">
            <button onclick="factorial()">🎯 Factorial</button>
            <button onclick="exponente()">⚡ Exponente</button>
            <button onclick="raizCuadrada()">√ Raíz Cuadrada</button>
        </div>
        
        <div class="result" id="resultado">
            Resultado: -
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
